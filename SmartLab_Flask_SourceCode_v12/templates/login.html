<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <title>Admin Login — SmartLab</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
{% include "_splash.html" %}
<div class="auth-wrap">
  <div class="auth-card">
    <div class="auth-brand brand-logo-plain"><img src="{{ url_for('static', filename='img/sfxc_logo_header.png') }}" alt="Saint Francis Xavier College" class="sfxc-crest"><img src="{{ url_for('static', filename='img/logo_full.png') }}" alt="SmartLab"></div>
    <div class="auth-sub">Computer Laboratory Monitoring System</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ 'success' if category == 'success' else 'error' }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="post" data-smartlab-validate>
      <div class="form-group">
        <label for="username">Username</label>
        <input class="form-control" type="text" id="username" name="username" required autofocus>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-block" data-done-btn data-busy-text="Signing in…">Sign in</button>
    </form>
  </div>
</div>
<script src="{{ url_for('static', filename='js/forms.js') }}"></script>
</body>
</html>
